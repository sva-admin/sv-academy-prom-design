<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Northlight</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Archivo:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#121110;color:#F2EEE6;font-family:Archivo,sans-serif}
.hero{position:relative;height:740px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9) brightness(.86)}
.grade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,9,8,.72) 0%,rgba(10,9,8,.08) 42%),linear-gradient(180deg,rgba(10,9,8,.42) 0%,rgba(10,9,8,0) 26%)}
.honesty{position:absolute;right:18px;top:18px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(242,238,230,.85);background:rgba(10,9,8,.45);padding:5px 10px}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:30px 48px}
.wordmark{font-family:"Cormorant Garamond",serif;font-size:21px;letter-spacing:.06em}
.nav{display:flex;gap:30px}
.nav a{color:rgba(242,238,230,.75);text-decoration:none;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.foot{position:absolute;left:48px;right:48px;bottom:40px;display:flex;justify-content:space-between;align-items:flex-end}
h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:66px;line-height:1.05;margin:0;max-width:13ch;text-wrap:balance}
h1 i{font-style:italic}
.meta{text-align:right;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(242,238,230,.7);line-height:2}

@media (max-width:768px){
 .top{padding:18px 20px;flex-wrap:wrap;gap:10px}
 .nav{gap:16px;flex-wrap:wrap}
 .nav a{font-size:10px;letter-spacing:.16em}
 .foot{left:20px;right:20px;bottom:22px;flex-direction:column;align-items:flex-start;gap:14px}
 h1{font-size:clamp(28px,8.6vw,66px)}
 .meta{text-align:left}
 .honesty{right:10px;top:auto;bottom:10px}
}
</style></head><body>
<div class="hero">
<img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1600&q=80&auto=format&fit=crop" alt="">
<div class="grade"></div><span class="honesty">Demonstration imagery</span>
<div class="top"><span class="wordmark">Northlight</span>
<nav class="nav"><a href="#">Fieldwork</a><a href="#">Prints</a><a href="#">Journal</a><a href="#">Commission</a></nav></div>
<div class="foot">
<h1>Landscapes photographed in the <i>last hour</i> of light.</h1>
<div class="meta">Fieldwork 2019 to 2026<br>214 frames kept of 41,800 taken<br>Prints edition of 9</div>
</div></div>
</body></html>
